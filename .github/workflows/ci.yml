name: ServeNow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Spring Boot (JDK 21 LTS) Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: marketplace_db
          MYSQL_USER: marketplace_user
          MYSQL_PASSWORD: marketplace_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit and Service Tests
        run: mvn clean test -Dspring.profiles.active=dev -DDB_URL="jdbc:mysql://localhost:3306/marketplace_db?useSSL=false&allowPublicKeyRetrieval=true" -DDB_USERNAME=marketplace_user -DDB_PASSWORD=marketplace_pass

      - name: Build Spring Boot Docker Image
        run: docker build -t smart-service-marketplace:${{ github.sha }} .

  ai-service-ci:
    name: AI Intelligence Microservice (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai-service/requirements.txt

      - name: Run AI Microservice Unit Tests
        run: |
          PYTHONPATH=ai-service pytest ai-service/tests

      - name: Run Automated Smoke Test Suite
        run: |
          python smoke_test.py

      - name: Build AI Service Docker Image
        run: docker build -t ai-service:${{ github.sha }} ./ai-service
